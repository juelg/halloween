<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan To Read</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #000; font-family: ui-monospace, Menlo, "Courier New", monospace; }
    .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 24px; padding: 16px; }
    .tag { border: 3px solid #000; border-radius: 16px; padding: 18px; text-align: center; break-inside: avoid; }
    .tag canvas { width: 100%; max-width: 320px; height: auto; image-rendering: pixelated; }
    .big { font-size: 26px; font-weight: 800; letter-spacing: 0.06em; margin: 8px 0 2px; }
    .small { font-size: 13px; margin: 0; }
    .url { font-size: 11px; margin-top: 6px; color: #333; word-break: break-all; }
    .toolbar { padding: 16px; display: flex; gap: 12px; flex-wrap: wrap; }
    button { font: inherit; padding: 10px 16px; border: 2px solid #000; background: #fff; border-radius: 8px; cursor: pointer; }
    body.bare .toolbar, body.bare .text { display: none; }
    body.bare .sheet { display: block; padding: 0; }
    body.bare .tag { border: 0; padding: 20px; border-radius: 0; }
    body.bare .tag canvas { max-width: none; width: 560px; }
    @media print { .toolbar { display: none; } .sheet { padding: 0; } }
  </style>
  <script src="vendor/qrcode.js"></script>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">PRINT</button>
    <a id="dl" download="qr.png"><button>DOWNLOAD PNG</button></a>
  </div>
  <div class="sheet" id="sheet"></div>
  <script>
    const URL_ = 'https://tobiasjuelg.de/halloween/mind.html';
    const bare = new URLSearchParams(location.search).has('bare');
    if (bare) document.body.classList.add('bare');

    function qrCanvas(text, scale) {
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      const n = qr.getModuleCount(), quiet = 4;
      const c = document.createElement('canvas');
      c.width = c.height = (n + quiet * 2) * scale;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#000';
      for (let r = 0; r < n; r++)
        for (let col = 0; col < n; col++)
          if (qr.isDark(r, col)) ctx.fillRect((col + quiet) * scale, (r + quiet) * scale, scale, scale);
      return c;
    }

    const copies = bare ? 1 : 4;
    for (let i = 0; i < copies; i++) {
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.appendChild(qrCanvas(URL_, 16));
      tag.insertAdjacentHTML('beforeend',
        '<div class="text"><p class="big">SCAN TO READ MY MIND</p>' +
        '<p class="small">AI2 EMBODIED AGENT v0.1 · costumes only · no photos uploaded</p>' +
        `<p class="url">${URL_.replace('https://', '')}</p></div>`);
      document.getElementById('sheet').appendChild(tag);
    }
    document.getElementById('dl').href = qrCanvas(URL_, 16).toDataURL('image/png');
  </script>
</body>
</html>
