<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan To Read</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #000; font-family: ui-monospace, Menlo, "Courier New", monospace; }
    .poster { max-width: 8in; margin: 0 auto; padding: 16px; text-align: center; }
    .poster canvas { width: 100%; max-width: 6in; height: auto; image-rendering: pixelated; display: block; margin: 0 auto; }
    .big { font-size: clamp(28px, 7vw, 56px); font-weight: 800; letter-spacing: 0.04em; margin: 0.15in 0 0.1in; line-height: 1.05; }
    .mid { font-size: clamp(16px, 3.4vw, 26px); font-weight: 700; margin: 0 0 0.12in; }
    .small { font-size: clamp(12px, 2.2vw, 16px); margin: 0; }
    .url { font-size: clamp(12px, 2.2vw, 18px); margin-top: 0.12in; word-break: break-all; }
    .toolbar { padding: 16px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    button { font: inherit; padding: 10px 16px; border: 2px solid #000; background: #fff; border-radius: 8px; cursor: pointer; }
    body.bare .toolbar, body.bare .text { display: none; }
    body.bare .poster { padding: 0; }
    @page { size: letter; margin: 0.5in; }
    @media print {
      .toolbar { display: none; }
      .poster { padding: 0; max-width: none; }
      .poster canvas { width: 6.2in; max-width: none; }
      .big { font-size: 50px; }
      .mid { font-size: 24px; }
      .small { font-size: 15px; }
      .url { font-size: 18px; }
    }
  </style>
  <script src="vendor/qrcode.js?v=20261031202541"></script>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">PRINT</button>
    <a id="dl" download="qr.png"><button>DOWNLOAD PNG</button></a>
  </div>
  <div class="poster">
    <canvas id="qr" aria-label="QR code"></canvas>
    <div class="text">
      <p class="big">SCAN TO READ MY MIND</p>
      <p class="mid">read my thoughts live · solve a riddle to take over my face</p>
      <p class="small">EMBODIED AGENT v0.1 · I roast costumes, never people · no photos uploaded</p>
      <p class="url" id="url"></p>
    </div>
  </div>
  <script>
    const URL_ = 'https://tobiasjuelg.de/halloween/';
    if (new URLSearchParams(location.search).has('bare')) document.body.classList.add('bare');

    function drawQr(c, text, scale) {
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      const n = qr.getModuleCount(), quiet = 4;
      c.width = c.height = (n + quiet * 2) * scale;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#000';
      for (let r = 0; r < n; r++)
        for (let col = 0; col < n; col++)
          if (qr.isDark(r, col)) ctx.fillRect((col + quiet) * scale, (r + quiet) * scale, scale, scale);
      return c;
    }

    drawQr(document.getElementById('qr'), URL_, 24);
    document.getElementById('url').textContent = URL_.replace('https://', '');
    document.getElementById('dl').href = document.getElementById('qr').toDataURL('image/png');
  </script>
</body>
</html>
